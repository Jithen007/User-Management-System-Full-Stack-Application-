<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Management System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>User Management System</h1>
  <div id="auth-status"></div>
</header>

<main>

  <!-- Optional login/register panel -->
  <section class="card" id="auth-card">
    <h2>Account (optional)</h2>
    <p class="hint">You can use the profile CRUD below with no login. Register/login only if you want a password-protected profile.</p>
    <div class="auth-tabs">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <form id="register-form" class="auth-form hidden">
      <input type="text" id="register-name" placeholder="Name" required />
      <input type="email" id="register-email" placeholder="Email" required />
      <input type="password" id="register-password" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>
    <p id="auth-message" class="message"></p>
  </section>

  <!-- Add / Edit profile form -->
  <section class="card">
    <h2 id="form-title">Add New Profile</h2>
    <form id="user-form">
      <input type="hidden" id="user-id" />
      <input type="text" id="name" placeholder="Full name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="number" id="age" placeholder="Age" min="0" />
      <textarea id="bio" placeholder="Short bio"></textarea>
      <div class="form-actions">
        <button type="submit" id="submit-btn">Add Profile</button>
        <button type="button" id="cancel-edit" class="secondary hidden">Cancel</button>
      </div>
    </form>
    <p id="form-message" class="message"></p>
  </section>

  <!-- List of profiles -->
  <section class="card">
    <h2>All Profiles</h2>
    <button id="refresh-btn" class="secondary">Refresh</button>
    <table id="users-table">
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Email</th><th>Age</th><th>Bio</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody"></tbody>
    </table>
    <p id="empty-message" class="hint hidden">No profiles yet — add one above.</p>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
